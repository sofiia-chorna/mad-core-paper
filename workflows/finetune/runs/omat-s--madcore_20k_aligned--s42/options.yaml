seed: 42
device: cuda
base_precision: 32

architecture:
  name: pet
  training:
    finetune:
      read_from: ${DEV_ROOT}/phace-atomic/mad-core-valid/experiments/models/pet-omat-s-v1.0.0.ckpt
      method: full
    batch_size: 64
    num_epochs: 150
    learning_rate: 1e-4
    warmup_fraction: 0.01
    log_mae: true
    log_interval: 1
    checkpoint_interval: 2
    best_model_metric: mae_prod

training_set:
  systems:
    read_from: ${DEV_ROOT}/phace-atomic/mad-core-valid/experiments/scratch_scaling_v3/manifests/xyz/madcore_20k_aug.xyz
    length_unit: angstrom
  targets:
    energy:
      key: atomization_energy
      unit: eV
      forces:
        key: forces
      stress: false

validation_set:
  systems:
    read_from: ${DEV_ROOT}/phace-atomic/mad-core-valid/experiments/scratch_scaling_v2/manifests/xyz/val_combined_1250.xyz
    length_unit: angstrom
  targets:
    energy:
      key: atomization_energy
      unit: eV
      forces:
        key: forces
      stress: false

test_set: 0.0

wandb:
  project: mad-core-valid
  name: finetune_aligned_20k-omat-s--madcore_20k_aligned--s42
  group: finetune_aligned_20k
  tags: [madcore_20k, aligned-with-scratch-round3, isolated-atom-references, val-random1000-madcore250, finetune, pet-s, pbe, corrected-attention-mask]
